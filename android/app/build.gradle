plugins { id 'com.android.application' }
android {
    namespace 'io.github.alaa1981qdroid.usooldeeni'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.alaa1981qdroid.usooldeeni'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('usool-deeni.keystore')
            storePassword 'usooldeeni'
            keyAlias 'usool'
            keyPassword 'usooldeeni'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
