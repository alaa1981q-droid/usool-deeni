<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14794f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جنّتي الصغيرة">
<title>جنّتي الصغيرة</title>
<meta name="description" content="جنّتي الصغيرة — أصول ديني الخمسة: تطبيق تفاعلي للأطفال، تصميم الشيخ علاء المطوري">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7f1; --green:#14794f; --green2:#1f9a66; --deep:#0e5a3a; --gold:#f2b632; --ink:#1d2b24; --muted:#5d6f66;
  --card:#ffffff; --line:#d6e9de; --ok:#1fa463; --bad:#e2504a;
  --c0:#14794f; --c1:#3fbf6f; --c2:#2f6fd0; --c3:#e57c1f; --c4:#7c4dc4; --c5:#13958c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.85;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:14px 14px 26px}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.hero{background:linear-gradient(160deg,#1a8d5c,#0e5a3a);border-radius:26px;color:#fff;padding:18px 16px 16px;text-align:center;position:relative;overflow:hidden}
.hero h1{margin:4px 0 0;font-size:30px;font-weight:800;color:#ffe08a}
.hero p{margin:0;opacity:.9;font-size:15px}
.hero .by{margin-top:6px;font-size:13px;opacity:.8}
.hero svg{width:200px;height:auto}
.stats{display:flex;gap:10px;margin:12px 0 4px}
.stat{flex:1;background:#fff;border-radius:16px;padding:8px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;color:var(--green)}
.stat span{font-size:13px;color:var(--muted)}

/* map */
.map{position:relative;margin-top:10px;padding:6px 0}
.node{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px;margin:10px 0;border:2px solid var(--line);
  width:88%;position:relative;transition:transform .15s;text-align:right;color:inherit}
.node:nth-child(odd){margin-right:0;margin-left:auto}
.node:nth-child(even){margin-left:0;margin-right:auto}
.node:active{transform:scale(.97)}
.node .ic{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.node .tx{flex:1;min-width:0}
.node .tx b{display:block;font-size:19px}
.node .tx small{color:var(--muted);font-size:14px}
.node .st{font-size:15px;letter-spacing:1px;color:var(--gold)}
.node.locked{opacity:.55;filter:grayscale(.8)}
.node.current{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,182,50,.25)}
.node.current .ic{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.badge{position:absolute;top:-9px;left:12px;background:var(--gold);color:#5a3c00;font-size:12px;font-weight:800;padding:0 9px;border-radius:20px}
.footer-links{display:flex;justify-content:center;gap:10px;margin-top:14px}
.link-btn{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--ink);display:grid;place-items:center;flex:none}
.bar .ttl{flex:1;font-weight:800;font-size:19px}
.prog{height:10px;background:#dcebe2;border-radius:10px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:10px;transition:width .35s}

/* card */
.card{background:var(--card);border-radius:24px;border:3px solid var(--sc,var(--green));padding:16px 16px 14px;position:relative;flex:1}
.card .num{position:absolute;top:-14px;right:16px;background:var(--sc,var(--green));color:#fff;font-weight:800;border-radius:20px;padding:0 12px;font-size:15px}
.card h2{margin:6px 0 8px;font-size:23px;color:var(--sc,var(--green))}
.card h2 small{display:block;font-size:15px;color:var(--muted);font-weight:500}
.art{background:linear-gradient(180deg,#fff7df,#ffe9b8);border-radius:18px;margin:6px 0 12px;overflow:hidden}
.art svg{display:block;width:100%;height:auto}
.card p{margin:0 0 10px}
.card p b,.card li b{color:var(--sc,var(--green))}
.box{border-radius:16px;padding:10px 12px;margin:12px 0 4px;border:2px solid;font-size:16.5px}
.box .h{font-weight:800;margin-bottom:2px}
.box.remember{background:#fff8e3;border-color:#f2c94c}
.box.know{background:#eef6ff;border-color:#8bb6ee}
.box.think{background:#f5efff;border-color:#b79be6}
.box.try{background:#ecfaf1;border-color:#86d3a5}
.ayah{font-family:'Amiri Quran','Amiri',serif;font-size:25px;line-height:2.2;text-align:center;background:#f6fbf8;border-radius:16px;padding:10px 12px;margin:10px 0 2px;color:#0b3d27}
.ayah sup{font-family:'Tajawal',sans-serif;font-size:12px;color:var(--green);font-weight:800;vertical-align:super}
.tr{text-align:center;color:var(--muted);font-size:16px;margin:2px 0 10px}
.vlist{list-style:none;padding:0;margin:6px 0}
.vlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.vlist li:last-child{border:0}
.vlist .q{font-family:'Amiri Quran','Amiri',serif;font-size:23px;line-height:2;color:#0b3d27}
.vlist .s{font-size:15.5px;color:var(--muted)}
.fn{border-top:1px solid #cfdcd4;margin-top:14px;padding-top:6px;font-size:13px;color:var(--muted);line-height:1.7}
.fn div{display:flex;gap:4px}
.fn sup{color:var(--green);font-weight:800}
.imams{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;padding:0;list-style:none;font-size:15.5px}
.imams li{background:#f4f0ff;border-radius:12px;padding:5px 8px}
.imams li b{color:var(--c4)}
.memo{background:linear-gradient(160deg,#fffaf0,#fff1c9);border:3px dashed var(--gold)}

.nav{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:none;border-radius:18px;padding:13px 10px;font-size:18px;font-weight:800;background:var(--green);color:#fff;box-shadow:0 5px 0 var(--deep);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 #c9dbd0}
.btn.gold{background:var(--gold);color:#4b3200;box-shadow:0 5px 0 #b9851a}
.btn[disabled]{opacity:.45}

/* quiz */
.qcard{background:#fff;border-radius:24px;padding:16px;border:3px solid var(--sc,var(--green))}
.qn{font-size:14px;color:var(--muted)}
.qq{font-size:22px;font-weight:800;margin:4px 0 14px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:#f7fbf9;border:2px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;font-size:18px;color:var(--ink)}
.opt .l{width:34px;height:34px;border-radius:50%;background:#e2efe7;display:grid;place-items:center;font-weight:800;flex:none}
.opt.sel{border-color:var(--sc,var(--green));background:#eef8f2}
.opt.ok{border-color:var(--ok);background:#e5f8ed}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fdecec}
.opt.bad .l{background:var(--bad);color:#fff}
.fb{min-height:30px;font-weight:700;text-align:center;margin-top:4px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}

/* result */
.result{text-align:center;background:#fff;border-radius:26px;padding:22px 16px;border:3px solid var(--sc,var(--green))}
.result .big{font-size:64px;line-height:1.2}
.result h2{margin:6px 0;font-size:26px}
.result .score{font-size:20px;color:var(--muted)}
.stars{font-size:40px;letter-spacing:6px;margin:6px 0}
.review{text-align:right;margin-top:12px;font-size:16px}
.review div{background:#fff5f4;border:1px solid #f3c6c3;border-radius:12px;padding:8px 10px;margin:6px 0}

/* certificate */
.cert{background:#fffdf5;border:6px double var(--gold);border-radius:22px;padding:22px 16px;text-align:center;position:relative}
.cert h2{color:var(--green);font-size:30px;margin:4px 0}
.cert .nm{font-size:30px;font-weight:800;color:#8a5a00;border-bottom:2px dashed var(--gold);display:inline-block;padding:0 14px;margin:6px 0}
.cert .dua{font-family:'Amiri Quran','Amiri',serif;font-size:19px;line-height:2;color:#0b3d27;margin-top:12px}
.inp{width:100%;font-family:inherit;font-size:20px;padding:12px;border-radius:14px;border:2px solid var(--line);text-align:center;margin:8px 0;-webkit-user-select:text;user-select:text}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.modal .in{background:#fff;border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.tip{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}

/* book reader (merged) */
.bookcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:#fff;border:2px solid var(--gold);border-radius:20px;padding:10px 12px;text-align:right;color:inherit;box-shadow:0 5px 0 #e9d49a}
.bookcard:active{transform:translateY(3px);box-shadow:0 2px 0 #e9d49a}
.bookcard img{width:62px;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
.bookcard b{display:block;font-size:19px;color:var(--deep)}
.bookcard small{color:var(--muted);font-size:14px;line-height:1.5;display:block}
.bookcard .go{margin-inline-start:auto;font-size:26px;color:var(--gold);flex:none}
.bar .pg{width:auto;padding:0 10px;font-size:15px;font-weight:700;gap:4px;display:flex;align-items:center}
.reader{position:fixed;inset:0;z-index:15;background:#e7efe9;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.reader.on{display:flex}
.rhead{display:flex;align-items:center;gap:8px;background:var(--deep);color:#fff;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.rhead .t{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:grid;place-items:center;flex:none}
.rbook{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.rbook::-webkit-scrollbar{display:none}
.rpage{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:10px;min-height:0;position:relative}
.rpage img{max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:1071/1511;object-fit:contain;border-radius:6px;box-shadow:0 6px 22px rgba(10,40,28,.2);background:#fff;display:block}
.rcta{position:absolute;bottom:calc(16px + 6%);left:50%;transform:translateX(-50%);border:0;color:#fff;font-weight:800;font-size:17px;padding:11px 22px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.3);white-space:nowrap;animation:rp 2.4s ease-in-out infinite}
@keyframes rp{50%{transform:translateX(-50%) scale(1.05)}}
.rfoot{display:flex;align-items:center;gap:10px;background:#fff;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.rfoot .rn{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:24px;color:var(--ink);flex:none;display:grid;place-items:center}
.rfoot .rn[disabled]{opacity:.35}
.rmid{flex:1;min-width:0}
.rwhere{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);line-height:1.4}
.rwhere b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmid input{width:100%;accent-color:var(--green);direction:rtl;margin:4px 0 0}
.rtoc{position:fixed;inset:0;z-index:18;display:none}
.rtoc.on{display:block}
.rtoc .sc{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.rtoc .dr{position:absolute;top:0;bottom:0;right:0;width:min(86vw,360px);background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.rtoc h3{margin:0;padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;font-size:20px}
.rtoc h3 button{border:0;background:none;font-size:28px;color:var(--muted)}
.rtoc .ls{overflow-y:auto;padding:0 8px 16px}
.rtoc .ls button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:right;padding:8px 10px;border-radius:12px;font-size:16px;color:var(--ink);line-height:1.5}
.rtoc .ls button.on{background:var(--bg);font-weight:800}
.rtoc .ls .m{font-weight:800;margin-top:6px}
.rtoc .ls .s{padding-inline-start:34px;font-size:15px;color:var(--muted)}
.rtoc .ls .d{width:12px;height:12px;border-radius:50%;flex:none}
.rtoc .ls .n{margin-inline-start:auto;color:var(--muted);font-size:13px}
.zoomv{position:fixed;inset:0;z-index:40;background:#0b0f0d;overflow:auto;display:none}
.zoomv.on{display:block}
.zoomv img{width:200%;max-width:none;display:block;margin:0 auto}
.zoomv.fit img{width:100%}
.zx{position:fixed;z-index:41;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;display:none}
.zx.on{display:block}
@media (prefers-reduced-motion: reduce){.rcta,.node.current .ic{animation:none}}

.chip{display:inline-block;margin-top:4px;background:#fff4d6;color:#7a5200;border:1px solid #f2c94c;border-radius:20px;padding:0 10px;font-size:13px;font-weight:800;line-height:1.9}
.titles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.badgewin{margin:12px auto 4px;max-width:320px;background:linear-gradient(160deg,#fff8e0,#ffe6a3);border:3px solid var(--gold);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.badgewin .medal{font-size:44px;line-height:1.1}
.badgewin small{color:#8a5a00;font-weight:700}
.badgewin b{font-size:26px;color:var(--deep)}
.badgewin span{font-size:17px;color:#5a3c00;font-weight:700}
.celebrate{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,40,28,.55)}
.celebrate.on{display:flex}
.celebrate .in{background:#fffdf5;border:6px double var(--gold);border-radius:28px;padding:22px 18px;max-width:360px;width:100%;text-align:center;animation:popin .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.celebrate .medal{font-size:72px;line-height:1;animation:swing 1.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.celebrate .gr{display:inline-block;background:var(--ok);color:#fff;border-radius:20px;padding:2px 16px;font-weight:800;font-size:18px;margin:8px 0 2px}
.celebrate h2{margin:6px 0 0;font-size:30px;color:var(--deep)}
.celebrate p{margin:4px 0 12px;font-size:19px;font-weight:700;color:#5a3c00}
@media (prefers-reduced-motion: reduce){.celebrate .in,.celebrate .medal{animation:none}}

.contestcard{border-color:#e57c1f;box-shadow:0 5px 0 #f3c08f}
.contestcard .cup{font-size:44px;width:62px;text-align:center;flex:none}
.ctscore:empty{display:none}
#ctBody .btn,#onBody .btn{flex:none}
#ctBody .nav .btn,#onBody .nav .btn{flex:1}
.board small.nk{display:block;font-weight:800;color:var(--ink)}
.ctscore{font-weight:800;color:#8a5a00;background:#fff4d6;border:2px solid var(--gold);border-radius:14px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.modes{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:right;color:inherit;background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px}
.mode .e{font-size:46px;flex:none;width:60px;text-align:center}
.mode b{display:block;font-size:20px}
.mode small{color:var(--muted);font-size:15px;line-height:1.6;display:block}
.mode.solo{border-color:#2f6fd0}.mode.duo{border-color:#e57c1f}
.rules{background:#fff8e3;border:2px solid #f2c94c;border-radius:16px;padding:10px 12px;font-size:16px;margin-top:4px}
.timer{height:12px;background:#dcebe2;border-radius:10px;overflow:hidden;margin:4px 0 10px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e2504a,#f2b632,#1fa463);border-radius:10px;transform-origin:right;transition:transform .2s linear}
.turn{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.turn .who{padding:2px 12px;border-radius:14px;color:#fff}
.streak{color:#e2504a;font-weight:800}
.pts{font-size:15px;color:var(--muted)}
.floatpts{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:44px;font-weight:800;color:var(--ok);pointer-events:none;z-index:36;animation:floatup 1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,-30%) scale(.8)}to{opacity:0;transform:translate(-50%,-140%) scale(1.3)}}
.handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.handoff .big{font-size:70px;line-height:1}
.handoff h2{margin:0;font-size:28px}
.board{display:flex;gap:10px;margin:10px 0}
.board div{flex:1;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.board div.win{border-color:var(--gold);background:#fff8e0}
.board b{display:block;font-size:30px;color:var(--deep);font-variant-numeric:tabular-nums}
.rank{font-size:22px;font-weight:800;margin:6px 0}
.inp2{margin:4px 0}
@media (prefers-reduced-motion: reduce){.floatpts{animation:none;opacity:0}}

.countdown{position:fixed;inset:0;z-index:37;display:flex;align-items:center;justify-content:center;background:rgba(10,40,28,.6)}
.countdown span{font-size:130px;font-weight:800;color:#ffe08a;text-shadow:0 6px 0 #b9851a;animation:cd .8s ease-out}
.countdown span.go{font-size:72px;color:#fff;text-shadow:0 6px 0 #0e5a3a}
@keyframes cd{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}
.hearts{font-size:22px;letter-spacing:2px}
.hearts.lose{animation:hb .5s}
@keyframes hb{30%{transform:scale(1.35)}}
.timer.hot i{animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{to{filter:brightness(1.4) saturate(1.6)}}
.timer.hot{box-shadow:0 0 0 3px rgba(226,80,74,.35)}
.helps{display:flex;gap:8px;margin-bottom:10px}
.help{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:4px 2px;font-size:22px;line-height:1.2;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.help small{font-size:12px;font-weight:700;color:var(--muted)}
.help:disabled{opacity:.35;filter:grayscale(1)}
.opt.gone{opacity:.25;text-decoration:line-through}

/* ---------- lesson ---------- */
let cur={s:0,p:0};
function verseBlock(list){
  let fn='';let body='';
  list.forEach((v,i)=>{const n=ar(i+1);body+=`<div class="ayah">﴿ ${v.a} ﴾<sup>${n}</sup></div>${v.t?`<div class="tr">${v.t}</div>`:''}`;fn+=`<div><sup>${n}</sup> ${v.s}</div>`});
  return body+`<div class="fn">${fn}</div>`;
}
function boxHTML(b){return b?`<div class="box ${b[0]}"><div class="h">${({remember:'💡 ',know:'⭐ ',think:'🤔 ',try:'✏️ '})[b[0]]}${b[1]}</div>${b[2]}</div>`:''}
function pages(s){const st=STAGES[s];const p=st.lessons.map((l,i)=>({l,i}));if(st.memo)p.push({memo:st.memo});p.push({exam:true});return p}
function openStage(i){cur={s:i,p:0};renderPage();show('lesson')}
function renderPage(){

    if(l.art)h+=`<div class="art">${ART[l.art]()}</div>`;
    if(l.surah){h+=`<ul class="vlist">${l.surah.map((v,k)=>`<li><div><div class="q">${v[0]} ﴿${ar(k+1)}﴾</div><div class="s">${v[1]}</div></div></li>`).join('')}</ul>`}
    if(l.imams){h+=`<ul class="imams">${l.imams.map((n,k)=>`<li><b>${ar(k+1)}</b> ${n}</li>`).join('')}</ul>`}
    if(l.body)h+=l.body.map(t=>`<p>${t}</p>`).join('');

  } else if(pg.memo){
    h=`<div class="card memo"><h2 style="text-align:center">⭐ آيةٌ أحفظها ⭐</h2><p style="text-align:center;color:var(--muted)">اقرأها ثلاث مرات بصوتٍ جميل حتى تحفظها</p>${verseBlock([pg.memo])}</div>`;
  } else {
    h=`<div class="card" style="text-align:center"><div style="font-size:60px;margin-top:10px">📝</div><h2>امتحان المرحلة</h2><p>أحسنت! أكملتَ دروس <b>${st.title}</b>.</p><p>الامتحان فيه <b>${ar(st.quiz.length)} أسئلة</b>. إذا أجبتَ عن <b>${ar(PASS)}</b> منها أو أكثر بشكلٍ صحيح تنجح وتُفتح لك المرحلة التالية.</p><div class="box remember" style="text-align:right"><div class="h">💡 تذكّر</div>إن أخطأتَ فلا تحزن! ارجع إلى الدرس واقرأه مرةً أخرى، وستجد الجواب بسهولة.</div></div>`;
  }
  $('#lsCard').innerHTML=h;
  $('#prevBtn').disabled=cur.p==0;
  const last=cur.p==P.length-1;
  $('#nextBtn').textContent=last?'ابدأ الامتحان ✍️':'التالي';
  $('#nextBtn').className='btn'+(last?' gold':'');

$('#prevBtn').onclick=()=>{if(cur.p>0){cur.p--;renderPage()}};
$('#nextBtn').onclick=()=>{const P=pages(cur.s);if(cur.p<P.length-1){cur.p++;renderPage()}else startQuiz()};
// swipe
(()=>{let x0=null;const el=$('#lsCard');el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<70)return;if(dx>0)$('#nextBtn').click();else $('#prevBtn').click()},{passive:true})})();

/* ---------- quiz ---------- */
let qz=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- question bank: book quizzes + QBANK, fresh-first picking ---------- */
const ALLQ=[];
STAGES.forEach((s,i)=>{s.quiz.forEach(q=>ALLQ.push({st:i,r:q.r,t:'mcq',q:q.q,o:q.o,a:q.a}));
  (typeof QBANK!=='undefined'?QBANK:[]).filter(q=>q.st===i).forEach(q=>ALLQ.push(q))});
(typeof QEXTRA!=='undefined'?QEXTRA:[]).forEach(q=>ALLQ.push({...q,st:0,r:0,g:1})); // general questions: contest only
ALLQ.forEach(q=>{q.id=q.st+':'+(q.q||q.v)});
function toPlay(q){
  if(q.t==='tf')return {...q,o:['صح ✓','خطأ ✗'],a:q.a?0:1,fixed:true};
  if(q.t==='verse')return {...q,q:'أكمل الآية:',verse:q.v,src:q.s};
  return {...q};
}
function withOpts(p){const o=p.o.map((t,k)=>({t,ok:k==p.a}));return {...p,opts:p.fixed?o:shuffle(o)}}
function pickFresh(pool,n){state.seen=state.seen||{};const s=state.seen,t=Date.now();
  const arr=shuffle(pool).sort((x,y)=>(s[x.id]||0)-(s[y.id]||0));const out=[];
  for(let i=0;i<n&&arr.length;i++)out.push(arr[i%arr.length]);
  out.forEach(q=>{s[q.id]=t});save();return out}
const PLAYABLE=q=>q.t==='mcq'||q.t==='tf'||q.t==='verse';
function qHead(p){return `<div class="qq">${p.q}</div>${p.verse?`<div class="ayah">${p.verse.replace('____','<span class="gapq">؟؟؟</span>')}</div><div class="tr">${p.src||''}</div>`:''}`}
function prepQ(q){
  if(q.t==='order')return {...q,shuf:shuffle(q.items)};
  if(q.t==='match')return {...q,right:shuffle(q.pairs.map(p=>p[1]))};
  return withOpts(toPlay(q));
}
const PAIRC=['#2f6fd0','#e57c1f','#7c4dc4','#13958c'];

function startQuiz(){
  const st=STAGES[cur.s];
  qz={qs:pickFresh(ALLQ.filter(q=>q.st===cur.s&&!q.g),5).map(prepQ),i:0,score:0,wrong:[],sel:null,checked:false};
  $('#qzTitle').textContent=`امتحان: ${st.title}`;renderQ();show('quiz');
}
function renderQ(){
  const q=qz.qs[qz.i];qz.sel=null;qz.checked=false;qz.seq=[];qz.pairs={};qz.pickL=null;
  $('#qzProg').style.width=(qz.i/qz.qs.length*100)+'%';
  let inner;
  if(q.t==='order')inner=`<div class="qq">${q.q}</div><ol class="slots" id="slots"></ol><div class="chipsq">${q.shuf.map((t,k)=>`<button class="opt ch" data-k="${k}">${t}</button>`).join('')}</div><button class="link-btn" id="clr">↺ ابدأ الترتيب من جديد</button>`;
  else if(q.t==='match')inner=`<div class="qq">${q.q}</div><p class="tip" style="margin:0 0 6px">اضغط على كلمة من اليمين، ثم على ما يناسبها من اليسار.</p><div class="mgrid"><div>${q.pairs.map((p,i)=>`<button class="opt ml" data-i="${i}">${p[0]}</button>`).join('')}</div><div>${q.right.map((t,j)=>`<button class="opt mr" data-j="${j}">${t}</button>`).join('')}</div></div>`;
  else inner=qHead(q)+q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${LET[k]}</span><span>${o.t}</span></button>`).join('');
  $('#qzBody').innerHTML=`<div class="qcard"><div class="qn">السؤال ${ar(qz.i+1)} من ${ar(qz.qs.length)}</div>${inner}<div class="fb" id="fb"></div></div>`;
  $('#checkBtn').disabled=true;$('#checkBtn').textContent='تأكيد الإجابة';$('#checkBtn').className='btn';
  const B=$('#qzBody');
  if(q.t==='order'){
    const draw=()=>{$('#slots').innerHTML=qz.seq.map(k=>`<li>${q.shuf[k]}</li>`).join('');
      B.querySelectorAll('.ch').forEach(b=>b.disabled=qz.checked||qz.seq.includes(+b.dataset.k));
      $('#checkBtn').disabled=qz.seq.length<q.items.length};
    B.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(qz.checked)return;qz.seq.push(+b.dataset.k);tone(600+qz.seq.length*60,.06,'sine');draw()});
    $('#clr').onclick=()=>{if(qz.checked)return;qz.seq=[];draw()};draw();
  } else if(q.t==='match'){
    const draw=()=>{B.querySelectorAll('.ml').forEach(b=>{const i=+b.dataset.i,j=qz.pairs[i];b.style.borderColor=j!=null?PAIRC[i]:(qz.pickL===i?'var(--sc,var(--green))':'');b.classList.toggle('sel',qz.pickL===i)});
      B.querySelectorAll('.mr').forEach(b=>{const j=+b.dataset.j,i=Object.keys(qz.pairs).find(k=>qz.pairs[k]===j);b.style.borderColor=i!=null?PAIRC[i]:''});
      $('#checkBtn').disabled=Object.keys(qz.pairs).length<q.pairs.length};
    B.querySelectorAll('.ml').forEach(b=>b.onclick=()=>{if(qz.checked)return;qz.pickL=+b.dataset.i;draw()});
    B.querySelectorAll('.mr').forEach(b=>b.onclick=()=>{if(qz.checked||qz.pickL==null)return;const j=+b.dataset.j;
      Object.keys(qz.pairs).forEach(k=>{if(qz.pairs[k]===j)delete qz.pairs[k]});qz.pairs[qz.pickL]=j;qz.pickL=null;tone(700,.06,'sine');draw()});
  } else {
    B.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(qz.checked)return;qz.sel=+b.dataset.k;B.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x==b));$('#checkBtn').disabled=false});
  }
}
$('#checkBtn').onclick=()=>{
  if(!qz.checked){
    const q=qz.qs[qz.i],B=$('#qzBody');let ok,fix='';
    if(q.t==='order'){if(qz.seq.length<q.items.length)return;ok=qz.seq.every((k,i)=>q.shuf[k]===q.items[i]);
      if(!ok)fix='الترتيب الصحيح: '+q.items.join(' ← ');}
    else if(q.t==='match'){if(Object.keys(qz.pairs).length<q.pairs.length)return;
      ok=q.pairs.every((p,i)=>q.right[qz.pairs[i]]===p[1]);
      B.querySelectorAll('.ml').forEach(b=>{const i=+b.dataset.i;b.classList.add(q.right[qz.pairs[i]]===q.pairs[i][1]?'ok':'bad')});
      if(!ok)fix='الصحيح: '+q.pairs.map(p=>p[0]+' ← '+p[1]).join('، ');}
    else{if(qz.sel==null)return;const btns=B.querySelectorAll('.opt');ok=q.opts[qz.sel].ok;
      btns[qz.sel].classList.add(ok?'ok':'bad');if(!ok)btns.forEach((b,i)=>{if(q.opts[i].ok)b.classList.add('ok')});}
    qz.checked=true;B.querySelectorAll('button.opt').forEach(b=>b.disabled=true);
    if(window.onAnswer)onAnswer(q,ok,qz.mode);
    if(ok){qz.score++;$('#fb').className='fb ok';$('#fb').textContent=['أحسنت! إجابة صحيحة 🌟','ممتاز! بارك الله فيك 👏','رائع! هذا هو الجواب ✅'][Math.floor(Math.random()*3)]}
    else{qz.wrong.push(q);$('#fb').className='fb bad';$('#fb').innerHTML='ليست هذه الإجابة، لا تحزن 💪'+(fix?`<div class="fixa">${fix}</div>`:'')}
    beep(ok);
    $('#checkBtn').textContent=qz.i<qz.qs.length-1?'السؤال التالي':'عرض النتيجة';
  } else {
    if(qz.i<qz.qs.length-1){qz.i++;renderQ()}else finishQuiz();
  }
};
$('#quizBack').onclick=()=>modal(`<h3 style="margin:4px 0">تريد الخروج من الامتحان؟</h3><p>ستضيع إجاباتك في هذه المحاولة.</p><div class="nav"><button class="btn sec" data-close>أكمل الامتحان</button><button class="btn" id="mExit">خروج</button></div>`,()=>{$('#mExit').onclick=()=>{closeModal();if(qz&&qz.mode){renderHome();show('home')}else{renderPage();show('lesson')}}});

function finishQuiz(){
  if(qz.mode&&window.wirdFinish)return wirdFinish();
  const st=STAGES[cur.s],n=qz.qs.length,sc=qz.score,pass=sc>=PASS;
  const stars=sc>=5?3:sc==4?2:sc>=PASS?1:0, grade=GRADE(sc);
  let h=`<div class="result">`;

    h+=next?`<p>فُتحت لك <b>المرحلة ${ar(cur.s+2)}: ${next.title}</b> 🔓</p>`:`<p>أكملتَ كل المراحل! شهادتك جاهزة 🏆</p>`;
    if(sc<n)h+=`<p class="tip">أجب عن الأسئلة كلّها صحيحة لتحصل على ٣ نجوم ⭐⭐⭐ — يمكنك إعادة الامتحان في أي وقت.</p>`;
    h+=`<div class="nav">${next?`<button class="btn gold" id="goNext">المرحلة التالية ←</button>`:`<button class="btn gold" id="goCert">شهادتي 🏆</button>`}</div><div class="nav"><button class="btn sec" id="goHome">خريطة المراحل</button></div>`;

  const cols=['#f2b632','#3fbf6f','#2f6fd0','#e57c1f','#7c4dc4','#13958c','#e2504a'];
  const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++t<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- picture book reader (merged) ---------- */
const BOOK_N=38;
const STAGE_PAGE=[2,7,13,19,25,31];
const QUIZ_PAGE={12:1,18:2,24:3,30:4,36:5};
const BTOC=[[1,'الغلاف',0],[2,'إلى صديقي الصغير',0],[3,'بيت ديني',0],[4,'سورة الحمد',0],[6,'سورة التوحيد',0],
 [7,'الأصل الأول: التوحيد',1,'--c1'],[8,'كيف نعرف أن الله موجود؟',2],[9,'أدلّة بسيطة',2],[10,'الله واحد',2],[11,'آيات عن التوحيد',2],[12,'اختبر نفسك: التوحيد',2],
 [13,'الأصل الثاني: العدل',1,'--c2'],[14,'الله عادلٌ لا يظلم',2],[15,'أنا أختار',2],[16,'لماذا نمرض أحيانًا؟',2],[17,'آيات عن العدل',2],[18,'اختبر نفسك: العدل',2],
 [19,'الأصل الثالث: النبوّة',1,'--c3'],[20,'لماذا أرسل الله الأنبياء؟',2],[21,'من هم الأنبياء؟',2],[22,'صفات الأنبياء ومعجزاتهم',2],[23,'آيات عن النبوّة',2],[24,'اختبر نفسك: النبوّة',2],
 [25,'الأصل الرابع: الإمامة',1,'--c4'],[26,'لماذا نحتاج إلى الإمام؟',2],[27,'يوم الغدير',2],[28,'الأئمة الاثنا عشر',2],[29,'آيات عن الإمامة',2],[30,'اختبر نفسك: الإمامة',2],
 [31,'الأصل الخامس: المعاد',1,'--c5'],[32,'رحلة الحياة',2],[33,'يوم القيامة والحساب',2],[34,'الجنة والنار',2],[35,'آيات عن المعاد',2],[36,'اختبر نفسك: المعاد',2],
 [37,'صفحة الإجابات',0],[38,'شهادة إتمام',0]];
const bSec=p=>{let t=BTOC[0];for(const e of BTOC)if(e[0]<=p)t=e;return t};
const rbook=$('#rbook'),rPages=[];
for(let i=1;i<=BOOK_N;i++){
  const d=document.createElement('section');d.className='rpage';d.dataset.p=i;
  const im=document.createElement('img');im.src='p/'+String(i).padStart(2,'0')+'.webp';im.alt='صفحة '+ar(i);im.loading=i<=2?'eager':'lazy';im.decoding='async';
  im.addEventListener('dblclick',openZoom);d.appendChild(im);
  if(QUIZ_PAGE[i]!=null){const si=QUIZ_PAGE[i],b=document.createElement('button');b.className='rcta';b.style.background=STAGES[si].color;
    b.textContent='✍️ ادخل امتحان '+STAGES[si].title;b.onclick=()=>{closeReader();cur={s:si,p:pages(si).length-1};renderPage();startQuiz()};d.appendChild(b)}
  rbook.appendChild(d);rPages.push(d);
}
const rtocLs=$('#rtocLs');
BTOC.forEach(([p,t,l,c])=>{const b=document.createElement('button');b.className=l==2?'s':'m';b.dataset.p=p;
  if(l!=2){const d=document.createElement('span');d.className='d';d.style.background=c?'var('+c+')':'var(--line)';b.appendChild(d)}
  b.appendChild(document.createTextNode(t));const n=document.createElement('span');n.className='n';n.textContent=ar(p);b.appendChild(n);
  b.onclick=()=>{$('#rtoc').classList.remove('on');rGo(p,false)};rtocLs.appendChild(b)});
let rCur=1;
function rUpdate(p){rCur=p;$('#rCount').textContent=ar(p)+' / '+ar(BOOK_N);$('#rSec').textContent=bSec(p)[1];$('#rSlider').value=p;
  $('#rPrev').disabled=p==1;$('#rNext').disabled=p==BOOK_N;
  rtocLs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.p==bSec(p)[0]));
  try{localStorage.setItem('usul5_book_page',p)}catch(e){}}
function rGo(p,smooth=true){p=Math.max(1,Math.min(BOOK_N,p));
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  rPages[p-1].scrollIntoView({inline:'center',block:'nearest',behavior:smooth&&!red?'smooth':'auto'});rUpdate(p)}
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)rUpdate(+e.target.dataset.p)}),{root:rbook,threshold:[.6]});
rPages.forEach(x=>rio.observe(x));
function openReader(p){$('#reader').classList.add('on');document.body.style.overflow='hidden';
  if(p==null){p=1;try{p=parseInt(localStorage.getItem('usul5_book_page'),10)||1}catch(e){}}
  requestAnimationFrame(()=>rGo(p,false))}
function closeReader(){$('#reader').classList.remove('on');$('#rtoc').classList.remove('on');document.body.style.overflow=''}
function openZoom(){const z=$('#zoomv');z.classList.remove('fit');$('#zimg').src=rPages[rCur-1].querySelector('img').src;z.classList.add('on');$('#zx').classList.add('on');
  z.scrollTop=0;z.scrollLeft=(z.scrollWidth-z.clientWidth)/2}
function closeZoom(){$('#zoomv').classList.remove('on');$('#zx').classList.remove('on')}
$('#zimg').addEventListener('dblclick',()=>$('#zoomv').classList.toggle('fit'));
$('#openBook').onclick=()=>openReader();
$('#lsBook').onclick=()=>openReader(STAGE_PAGE[cur.s]);
$('#rClose').onclick=closeReader;$('#rZoom').onclick=openZoom;$('#zx').onclick=closeZoom;
$('#rTocBtn').onclick=()=>{$('#rtoc').classList.add('on');const o=rtocLs.querySelector('.on');o&&o.scrollIntoView({block:'center'})};
$('#rtocX').onclick=$('#rtocSc').onclick=()=>$('#rtoc').classList.remove('on');
$('#rPrev').onclick=()=>rGo(rCur-1);$('#rNext').onclick=()=>rGo(rCur+1);
$('#rSlider').oninput=()=>rGo(+$('#rSlider').value,false);
document.addEventListener('keydown',e=>{if($('#zoomv').classList.contains('on')){if(e.key=='Escape')closeZoom();return}
  if(!$('#reader').classList.contains('on'))return;
  if(e.key=='ArrowLeft')rGo(rCur+1);else if(e.key=='ArrowRight')rGo(rCur-1);else if(e.key=='Escape')closeReader()});

const APP_VER='2.8';
$('#verLine').textContent=`الإصدار ${ar(APP_VER).replace('.','٫')} · ${ar(ALLQ.length)} سؤالًا`;
renderHome();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
